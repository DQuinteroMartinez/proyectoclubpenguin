<nav>
  <span class="titulo">Club Penguin</span>

  @if (sesionIniciada$ | async) {
    <span class="usuario">{{ nombreUsuario }}</span>
    @if (esAdmin$ | async) {
      <span class="insignia-admin">ADMIN</span>
    }
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  } @else {
    <a routerLink="/login">Iniciar sesión</a>
    <a routerLink="/registro">Registrarse</a>
  }
</nav>
