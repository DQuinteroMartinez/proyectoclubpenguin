<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/mapa">
      <img class="logo" src="/public/logoClubPenguin.png" alt="Logo de Club Penguin" />
      <span>Club Penguin</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      aria-label="Mostrar u ocultar el menú"
      (click)="alternarMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto()">
      @if (sesionIniciada$ | async) {
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/mapa" routerLinkActive="active" (click)="cerrarMenu()">Mapa</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/minijuegos"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="cerrarMenu()"
            >Minijuegos</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/minijuegos/historial" routerLinkActive="active" (click)="cerrarMenu()">Historial</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/rankings" routerLinkActive="active" (click)="cerrarMenu()">Rankings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/retos" routerLinkActive="active" (click)="cerrarMenu()">Retos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/usuarios" routerLinkActive="active" (click)="cerrarMenu()">Usuarios</a>
          </li>
          @if (esAdmin$ | async) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/administracion" routerLinkActive="active" (click)="cerrarMenu()">Administración</a>
            </li>
          }
        </ul>

        <div class="d-flex align-items-center gap-2 text-white">
          <span>{{ nombreUsuario }}</span>
          @if (esAdmin$ | async) {
            <span class="badge text-bg-warning">ADMIN</span>
          }
          <button class="btn btn-outline-light btn-sm" type="button" (click)="cerrarSesion()">
            Cerrar sesión
          </button>
        </div>
      } @else {
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="cerrarMenu()">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/registro" routerLinkActive="active" (click)="cerrarMenu()">Registrarse</a>
          </li>
        </ul>
      }
    </div>
  </div>
</nav>
